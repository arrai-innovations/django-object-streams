[build-system]
requires = ["setuptools>=78.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-object-streams"
description = "Permission-aware object and queryset subscriptions for Django."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Arrai Innovations", email = "support@arrai.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dynamic = ["version"]
dependencies = [
    "channels>=4.2.0,<5",
    "django>=5.2.14,<6.2",
    "django-filter>=23.5",
]

[project.optional-dependencies]
# Trigger-based capture. The library works without it; producers are then called
# from application code instead.
triggers = [
    "django-pgtrigger>=4.11",
]

[project.urls]
repository = "https://github.com/arrai-innovations/django-object-streams/"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "channels-redis>=4.3.0",
    "coverage>=7.14.1",
    "daphne>=4.1.0",
    "psycopg[binary]>=3.3.3",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.8.0",
    "pytest-sugar>=1.0.0",
    "django-pgtrigger>=4.11",
    "ruff==0.15.20",
]
docs = [
    "pdoc>=16.0.0",
]

[tool.uv]
default-groups = ["dev", "docs"]
exclude-newer = "1 day"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"object_streams" = ["py.typed"]

[tool.setuptools.packages.find]
include = ["object_streams*"]

[tool.setuptools.dynamic]
version = { attr = "object_streams.__version__" }

[tool.coverage.run]
branch = true
parallel = true
source = ["./object_streams"]
omit = [
    "*/migrations/*",
    "*tests*",
]

[tool.coverage.html]
directory = "htmlcov/"

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "except ImportError",
    "raise ImportError",
]

[tool.pytest.ini_options]
django_find_project = false
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--ds=tests.settings"
testpaths = ["tests"]
python_files = [
    "test_*.py",
]
